name: Build N3DS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - uses: actions/checkout@v4

      - name: Build 3DSX and CIA
        run: make cia

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stardew-n3ds
          path: |
            stardew-n3ds.3dsx
            stardew-n3ds.smdh
            stardew-n3ds.elf
            stardew-n3ds.cia
