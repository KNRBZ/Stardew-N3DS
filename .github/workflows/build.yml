name: Build N3DS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20260610

    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS tools
        run: dkp-pacman -S --noconfirm 3dstools

      - name: Build 3DSX and CIA
        run: make cia

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stardew-n3ds
          path: |
            stardew-n3ds.3dsx
            stardew-n3ds.smdh
            stardew-n3ds.elf
            stardew-n3ds.cia

      - name: Publish CIA to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          git checkout --orphan gh-pages
          git rm -rf . || true
          cp "$GITHUB_WORKSPACE/stardew-n3ds.cia" ./stardew-n3ds.cia
          cp "$GITHUB_WORKSPACE/stardew-n3ds.3dsx" ./stardew-n3ds.3dsx
          git add stardew-n3ds.cia stardew-n3ds.3dsx
          git commit -m "Publish latest N3DS build"
          git push --force origin gh-pages
